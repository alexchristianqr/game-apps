<!-- Fondo animado global -->
<div class="pointer-events-none fixed inset-0 -z-10 overflow-hidden bg-grid" aria-hidden="true">
  <div class="absolute -top-32 -left-24 size-[28rem] animate-blob rounded-full bg-neon-violet/25 blur-3xl"></div>
  <div class="absolute top-1/3 -right-32 size-[26rem] animate-blob rounded-full bg-neon-cyan/20 blur-3xl [animation-delay:-6s]"></div>
  <div class="absolute -bottom-40 left-1/3 size-[30rem] animate-blob rounded-full bg-neon-pink/20 blur-3xl [animation-delay:-12s]"></div>
</div>

<header class="sticky top-0 z-40 border-x-0 border-t-0 bg-ink-950/60 glass">
  <div class="mx-auto flex max-w-6xl items-center justify-between gap-3 px-4 py-3">
    <a routerLink="/home" class="flex items-center gap-2">
      <lucide-icon [img]="icons.Gamepad2" [size]="28" class="text-neon-cyan drop-shadow-[0_0_8px_var(--color-neon-cyan)]" />
      <span class="text-gradient font-display text-lg font-black tracking-wider sm:text-xl">{{ title }}</span>
    </a>

    <nav class="flex items-center gap-2" aria-label="Principal">
      <a routerLink="/home" routerLinkActive="text-neon-cyan" class="rounded-lg px-3 py-2 text-sm font-medium text-white/80 transition hover:text-white">Juegos</a>
      @if (isAuthenticated()) {
        <button appButton variant="ghost" size="sm" type="button" (click)="logout()">
          <lucide-icon [img]="icons.LogOut" [size]="16" />
          Salir
        </button>
      } @else {
        <a appButton size="sm" routerLink="/login">
          <lucide-icon [img]="icons.LogIn" [size]="16" />
          Entrar
        </a>
      }
    </nav>
  </div>
</header>

<main class="mx-auto min-h-[calc(100dvh-8rem)] max-w-6xl px-4 py-8 sm:py-12">
  <router-outlet />
</main>

<footer class="py-6 text-center text-sm text-white/50">
  <a href="https://github.com/alexchristianqr/game-apps" target="_blank" rel="noopener" class="inline-flex items-center gap-2 transition hover:text-white">
    <lucide-icon [img]="icons.Github" [size]="16" />
    Código en GitHub
  </a>
</footer>

<app-toast-outlet />
