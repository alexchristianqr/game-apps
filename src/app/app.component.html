<mat-toolbar color="primary" class="border-0">
  <mat-toolbar-row>
    <button role="button" mat-button routerLink="/">
      <mat-icon>grid_view</mat-icon>
      {{ title }}
    </button>
  </mat-toolbar-row>
</mat-toolbar>

<mat-divider class="bg-transparent"></mat-divider>

<mat-toolbar color="accent" class="border-0">
  @if (isAuthenticated()) {
  <button mat-button routerLink="/home"><mat-icon>home</mat-icon>Inicio</button>
  }

  <span class="example-spacer"></span>
  @if (isAuthenticated()) {
  <button mat-button (click)="logout()">
    <mat-icon>exit_to_app</mat-icon>
    Salir
  </button>
  }
</mat-toolbar>

<router-outlet> </router-outlet>
