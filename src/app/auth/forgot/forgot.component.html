<div class="mx-auto max-w-md">
  <app-panel>
    <h1 class="mb-6 text-gradient text-center font-display text-2xl font-black">¿Olvidaste tu contraseña?</h1>

    <form [formGroup]="formGroup" (ngSubmit)="onSubmit()" class="space-y-4">
      <app-field label="Email" [error]="submitted && formGroup.controls['email'].invalid ? 'Ingrese un email válido' : null">
        <input type="email" class="app-input" formControlName="email" name="email" autocomplete="email" required />
      </app-field>

      @if (submitted === false) {
        <p class="text-sm text-rose-400" role="alert">No se ha enviado el enlace</p>
      }

      <button appButton class="w-full" type="submit" [disabled]="loading">
        @if (loading) {
          <lucide-icon [img]="icons.LoaderCircle" [size]="18" class="animate-spin" />
          Enviando...
        } @else {
          Enviar enlace
        }
      </button>
    </form>

    <p class="mt-6 text-center text-sm text-white/70">Ya tengo una cuenta <a routerLink="/login" class="text-neon-cyan hover:underline">Iniciar sesión</a></p>
  </app-panel>
</div>
