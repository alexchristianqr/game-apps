<div class="mx-auto max-w-md">
  <app-panel>
    <div class="mb-6 flex items-center justify-between">
      <a appButton variant="ghost" size="sm" routerLink="/home" aria-label="Volver al inicio">
        <lucide-icon [img]="icons.ArrowLeft" [size]="18" />
      </a>
      <h1 class="text-gradient font-display text-xl font-black">Tres en línea</h1>
    </div>

    <!-- Marcador y turno -->
    <div class="mb-6 grid grid-cols-2 gap-3 text-center">
      <div class="rounded-2xl bg-white/5 p-3 ring-1 ring-white/10 transition" [class.ring-neon-cyan]="playing() && !robotTurn()" [class.shadow-glow-cyan]="playing() && !robotTurn()">
        <div class="font-display text-2xl font-black text-neon-cyan">X</div>
        <div class="text-sm text-white/70">Tú</div>
      </div>
      <div class="rounded-2xl bg-white/5 p-3 ring-1 ring-white/10 transition" [class.ring-neon-pink]="playing() && robotTurn()" [class.shadow-glow-pink]="playing() && robotTurn()">
        <div class="font-display text-2xl font-black text-neon-pink">O</div>
        <div class="text-sm text-white/70">Robot</div>
      </div>
    </div>

    <!-- Tablero -->
    <div class="mx-auto grid aspect-square w-full max-w-xs grid-cols-3 gap-2" role="group" aria-label="Tablero">
      @for (cell of board(); track $index; let i = $index) {
        <button
          type="button"
          class="grid aspect-square place-items-center rounded-2xl font-display text-5xl font-black ring-1 transition enabled:hover:bg-white/10 enabled:active:scale-95 disabled:cursor-default"
          [class]="cellClass(cell, i)"
          [attr.aria-label]="cellLabel(i)"
          [disabled]="!playing() || robotTurn()"
          (click)="makeHumanMove(i)"
        >
          @if (cellText(cell); as text) {
            <span class="animate-pop drop-shadow-[0_0_10px_currentColor]">{{ text }}</span>
          }
        </button>
      }
    </div>

    <!-- Resultado -->
    @if (message) {
      <p class="mt-6 animate-pop text-center font-display text-xl font-bold" role="status">{{ message }}</p>
    }

    <!-- Acciones -->
    <div class="mt-6 flex flex-wrap justify-center gap-3">
      @if (!playing()) {
        <button appButton type="button" (click)="startGame()">{{ message ? "Jugar otra vez" : "Empezar" }}</button>
      } @else {
        <button appButton variant="success" type="button" (click)="restartGame()">Reiniciar</button>
        <button appButton variant="danger" type="button" (click)="endGame()">Terminar</button>
      }
    </div>

    <!-- Ajustes -->
    <div class="mt-8 border-t border-white/10 pt-4">
      <button
        type="button"
        class="flex w-full items-center justify-between rounded-lg py-2 text-left font-semibold"
        [attr.aria-expanded]="settingsOpen()"
        aria-controls="ajustes"
        (click)="settingsOpen.set(!settingsOpen())"
      >
        Ajustes del juego
        <lucide-icon [img]="icons.ChevronDown" [size]="20" class="transition" [class.rotate-180]="settingsOpen()" />
      </button>

      @if (settingsOpen()) {
        <div id="ajustes" class="mt-3 animate-fade-up space-y-5">
          <app-toggle [(ngModel)]="computerFirst">El robot empieza primero</app-toggle>

          <label class="block">
            <span class="mb-1.5 block text-sm font-medium text-white/80">Nivel de dificultad</span>
            <select class="app-input" [(ngModel)]="difficulty">
              @for (item of dataLevels; track item.value) {
                <option [value]="item.value">{{ item.text }}</option>
              }
            </select>
          </label>

          <div class="space-y-2">
            <app-toggle [(ngModel)]="allowSoundEndGame">Sonido al terminar el juego</app-toggle>
            <input
              type="range"
              min="0"
              max="100"
              step="5"
              class="w-full accent-neon-cyan"
              aria-label="Volumen del sonido al terminar"
              [disabled]="!allowSoundEndGame"
              [(ngModel)]="volumeSoundEndGame"
            />
          </div>

          <div class="space-y-2">
            <app-toggle [(ngModel)]="allowSoundThemeGame">Sonido durante el juego</app-toggle>
            <input
              type="range"
              min="0"
              max="100"
              step="5"
              class="w-full accent-neon-pink"
              aria-label="Volumen del sonido durante el juego"
              [disabled]="!allowSoundThemeGame"
              [(ngModel)]="volumeSoundThemeGame"
            />
          </div>
        </div>
      }
    </div>
  </app-panel>
</div>
